name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# CI 中的 Redis：本仓库的 Lua 脚本必须**在真实 Redis 上**验证。
# 原因：FakeRedis / fakeredis 是按脚本文本分派到等价 Python 实现的替身，
# 它验证的是「语义契约」，无法发现 Lua 下标错位、key 折叠这类问题
# （真实踩到过：naxes 公式错、总账写轴名而非轴取值、token 总账 key 与 token 轴 key 折叠）。
# 因此这里起一个 Redis service，并通过 CG_TEST_REDIS_URL 打开 [real] 参数化用例。
env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"
  CG_TEST_REDIS_URL: redis://127.0.0.1:6379/15

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 代码风格
        # 与姊妹项目 code-review-bot 使用同一套规则集（见 pyproject.toml 的 [tool.ruff]）
        run: ruff check costgovernor tests
      - name: 运行测试（含真实 Redis 用例）
        run: python -m pytest -q -rs
      - name: CLI 冒烟测试
        run: |
          python -m costgovernor.cli --help
          python -m costgovernor.cli price-check --model deepseek-flash
      - name: 断言真实 Redis 真的可用（防止假绿灯）
        # 防止两种"假绿灯"：
        #   1) Redis service 挂了导致 [real] 用例全部 skip；
        #   2) 固件参数写错导致根本没收集到 [real] 用例。
        # 做法是只跑一条**断言式**用例（它真的连 Redis 并执行一次 Lua），
        # 而不是解析 pytest 的输出文本 —— 后者在 CI 上真实踩过坑：
        # pytest 9 的 `--collect-only -q` 只输出「文件: 用例数」汇总，抓不到 [real] 标记。
        run: python -m pytest tests -k "real_backend_is_actually_available" -v

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证镜像可构建
        run: docker build -t llm-cost-governor:ci .
      - name: 验证镜像入口可执行
        run: docker run --rm llm-cost-governor:ci price-check --model deepseek-v4-pro
